<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#2146d0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml">

  <title>TMS E-Learning</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: white;
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,.10);
    }

    .logo {
      font-size: 64px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      margin: 10px 0 28px;
      color: #718096;
      font-size: 15px;
      line-height: 1.6;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 15px 20px;
      border: 0;
      border-radius: 14px;
      background: #2146d0;
      color: white;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .btn:hover {
      opacity: .92;
    }

    .note {
      margin-top: 18px;
      font-size: 12px;
      color: #718096;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">🎓</div>

    <h1>TMS E-Learning</h1>

    <div class="subtitle">
      ระบบเรียนออนไลน์สำหรับพนักงาน<br>
      Training Management System
    </div>

    <a
      class="btn"
      href="https://script.google.com/macros/s/AKfycbzD9XcSLtAroFJRk1qOgQOOfrJcnuwGAykvtda1IlQT5YIOgTJZJQZLZa22TK4LRP5QtA/exec?page=elearning">
      เข้าสู่ E-Learning
    </a>

    <div class="note">
      กดปุ่มด้านบนเพื่อเข้าสู่ระบบ E-Learning
    </div>

  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker
          .register("./sw.js")
          .catch(function (error) {
            console.log("Service Worker:", error);
          });
      });
    }
  </script>

</body>
</html>
