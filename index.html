<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#2146d0">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml">

<title>TMS E-Learning</title>

<style>
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #f4f7fb;
  font-family: system-ui,-apple-system,"Segoe UI",sans-serif;
}

#app {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

#loading {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  background: #f4f7fb;
}

.box {
  text-align: center;
  padding: 24px;
}

.logo {
  font-size: 54px;
}

.small {
  font-size: 13px;
  color: #718096;
  margin-top: 8px;
}
</style>
</head>

<body>

<div id="loading">
  <div class="box">
    <div class="logo">🎓</div>
    <strong>กำลังเปิด TMS E-Learning...</strong>
    <div class="small">กรุณารอสักครู่</div>
  </div>
</div>

<iframe
  id="app"
  src="https://script.google.com/macros/s/AKfycbyU1X6tyqx1iQsqQ1KawPgPAqL6vanhyFjI9CpExOcpvLWGucu3LeGNmawNI_rKA8Zw8g/exec?page=elearning"
  allow="autoplay; fullscreen"
  allowfullscreen>
</iframe>

<script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {

    navigator.serviceWorker
      .register('./sw.js')
      .catch(function (error) {
        console.log('Service Worker:', error);
      });

  });
}

const app = document.getElementById('app');
const loading = document.getElementById('loading');

app.addEventListener('load', function () {
  setTimeout(function () {
    loading.style.display = 'none';
  }, 500);
});

</script>

</body>
</html>
